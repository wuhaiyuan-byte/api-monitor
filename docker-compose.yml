version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: apimon
      POSTGRES_PASSWORD: apimon123
      POSTGRES_DB: apimon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apimon"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://apimon:apimon123@db:5432/apimon
    ports:
      - "9876:8000"   # alt host port — operator's network filters 8000/tcp
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend   # live frontend — rsync index.html and refresh, no rebuild
      - ./data:/app/data   # persistent runtime data (OSS Fernet key, etc.)

volumes:
  pgdata: